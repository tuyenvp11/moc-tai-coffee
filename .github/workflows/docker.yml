name: Docker build and smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies and check application
        run: |
          npm ci
          npm test
          npm run build
          npm run test:production
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the container
        run: docker compose up --build --wait --wait-timeout 90
      - name: Check the running application
        run: node scripts/smoke-docker.mjs http://127.0.0.1:8080
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down
